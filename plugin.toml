schema_version = 1

[plugin]
id          = "bazarr"
name        = "Bazarr"
version     = "1.0.0"
description = "Finds and downloads subtitles"
without_it  = "No automatic subtitles"
upstream    = "https://github.com/morpheus65535/bazarr"
license     = "GPL-3.0-only"
forms       = ["tv", "movies", "auto", "full"]

[[service]]
id          = "bazarr"
name        = "Bazarr"
image       = "lscr.io/linuxserver/bazarr"
digest      = "sha256:c1673816321156b904af9b7e6415ea547ae9622e4acc375358f1e1eb9ed1e904"
tag         = "v1.6.2-ls367"
port        = 6767
bind        = "loopback"
listens     = 6767
health      = { kind = "http", path = "/", timeout_s = 90 }
criticality = "enhancing"
memory_mib  = 250
reaches     = "the subtitle providers you enable"
asks_for    = "Searches for subtitles matching what is in your library, signing in where a provider requires an account."
takes_data  = true
user_mode   = "puid-env"
replaces    = "bazarr"

[[service]]
id          = "bazarr-adapter"
name        = "Bazarr adapter"
image       = "ghcr.io/lemonfiber/bazarr-adapter"
digest      = "sha256:8195988317c635559e35ddcdf6305a465e9855f8c60b1c156cd456c019dc9d4e"
tag         = "main-bda08e68553d"
criticality = "enhancing"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's subtitles.fetch contract by calling Bazarr, beside it, with the key lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["subtitles.fetch@1"]
fronts      = "bazarr"
provides    = ["subtitles.fetch"]
upstream    = { api_key = { secret = "upstream-key" } }

[[secret]]
id     = "upstream-key"
of     = "bazarr"
minted = true
why    = "The key Bazarr answers its API to, which the adapter in front of it presents"

[[proof]]
id      = "bazarr.guarded"
service = "bazarr"
title   = "Bazarr shows its own state to nobody presenting nothing"
fixture = "recordings/bazarr/status-guarded.json"
why     = """
Bazarr holds subtitle-provider accounts and a path into the library. Only the
adapter asks it, with the key lemonfiber minted, so a Bazarr that answered its
state to a caller presenting nothing would be telling every device that can
reach it.
"""
request = { method = "GET", path = "/api/system/status" }
expect  = { status = 401, json_types = { message = "str" } }

[[ask]]
service    = "bazarr"
capability = "library.curate"
each       = true

[[ask]]
service    = "bazarr"
capability = "dashboard.show"
